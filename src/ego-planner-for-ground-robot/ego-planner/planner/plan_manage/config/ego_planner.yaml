# ROS 2 (Humble) parameter file for the ego-planner ground robot stack.
# It replaces the former `launch/advanced_param.xml` + <remap>/<param> blocks.
# Values can be overridden at launch time (see launch/run_in_sim.launch.py).

ego_planner_node:
  ros__parameters:
    # ------------------------- planning FSM -------------------------
    fsm:
      # 1: goal comes from RViz (2D Goal Pose) / a PoseStamped topic
      # 2: fixed waypoints given below
      flight_type: 1
      thresh_replan: 1.5
      thresh_no_replan: 2.0
      planning_horizon: 10.5   # ~1.5x the sensor horizon
      planning_horizen_time: 3.0
      emergency_time_: 1.0
      w_adjust_: 1.0

      waypoint_num: 5
      waypoint0_x: -15.0
      waypoint0_y: 0.0
      waypoint0_z: 1.0
      waypoint1_x: 0.0
      waypoint1_y: 15.0
      waypoint1_z: 1.0
      waypoint2_x: 15.0
      waypoint2_y: 0.0
      waypoint2_z: 1.0
      waypoint3_x: 0.0
      waypoint3_y: -15.0
      waypoint3_z: 1.0
      waypoint4_x: -15.0
      waypoint4_y: 0.0
      waypoint4_z: 1.0

    # ------------------------- grid map -------------------------
    grid_map:
      resolution: 0.1
      map_size_x: 300.0
      map_size_y: 300.0
      map_size_z: 4.0
      local_update_range_x: 8.0
      local_update_range_y: 8.0
      local_update_range_z: 1.5
      obstacles_inflation: 0.5
      local_map_margin: 2
      ground_height: -0.01
      # camera intrinsics (only used with the depth-image pipeline)
      cx: 321.04638671875
      cy: 243.44969177246094
      fx: 387.229248046875
      fy: 387.229248046875
      use_depth_filter: true
      depth_filter_tolerance: 0.15
      depth_filter_maxdist: 5.0
      depth_filter_mindist: 0.2
      depth_filter_margin: 1
      k_depth_scaling_factor: 1000.0
      skip_pixel: 2
      p_hit: 0.65
      p_miss: 0.35
      p_min: 0.12
      p_max: 0.90
      p_occ: 0.80
      min_ray_length: 0.1
      max_ray_length: 4.0
      virtual_ceil_height: 2.5
      visualization_truncate_height: 1.6
      show_occ_time: false
      pose_type: 2      # 2: use odometry, 1: use PoseStamped
      map_type: 1       # 1: PLANNING (2D grid from segmented cloud), 2: EXPLORATION
      frame_id: "map"

    # ------------------------- planner manager -------------------------
    manager:
      max_vel: 1.5
      max_acc: 3.0
      max_jerk: 4.0
      control_points_distance: 0.6
      feasibility_tolerance: 0.05
      planning_horizon: 10.5

    # ------------------------- trajectory optimization -------------------------
    optimization:
      lambda_smooth: 1.0
      lambda_collision: 0.8
      lambda_feasibility: 0.1
      lambda_fitness: 1.0
      dist0: 1.0
      max_vel: 1.5
      max_acc: 3.0
      order: 3

    bspline:
      limit_vel: 1.5
      limit_acc: 3.0
      limit_ratio: 1.1

# ---------------------------------------------------------------------------
# MPC trajectory tracking (traj_server). In ROS 1 these weights lived inside the
# ego_planner_node namespace; in ROS 2 every node reads its own parameters, so
# the values have to be listed here again. Keep both in sync.
# ---------------------------------------------------------------------------
traj_server:
  ros__parameters:
    MPC:
      v_max: 1.8
      w_max: 1.2
      omega0: 1.0
      omega1: 0.1
    # Optional topic publishing a geometry_msgs/PoseStamped used for the current
    # yaw. Leave empty to rely on the odometry topic only.
    pose_topic: ""
