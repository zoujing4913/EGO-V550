# ego-planner parameters tuned for the ego_ground_sim arena
# (30 x 30 m, 0.12 m wheels, ~1 m/s robot).  Same structure as the robot
# configuration in ego_planner/config/ego_planner.yaml.

ego_planner_node:
  ros__parameters:
    use_sim_time: true

    fsm:
      flight_type: 1          # goal comes from RViz / a PoseStamped topic
      thresh_replan: 1.0
      thresh_no_replan: 1.5
      planning_horizon: 9.0
      planning_horizen_time: 3.0
      emergency_time_: 1.0
      w_adjust_: 0.8
      waypoint_num: 0

    grid_map:
      resolution: 0.1
      map_size_x: 40.0
      map_size_y: 40.0
      map_size_z: 3.0
      local_update_range_x: 6.0
      local_update_range_y: 6.0
      local_update_range_z: 1.5
      obstacles_inflation: 0.35
      local_map_margin: 2
      ground_height: -0.05
      cx: 321.04638671875
      cy: 243.44969177246094
      fx: 387.229248046875
      fy: 387.229248046875
      use_depth_filter: true
      depth_filter_tolerance: 0.15
      depth_filter_maxdist: 5.0
      depth_filter_mindist: 0.2
      depth_filter_margin: 1
      k_depth_scaling_factor: 1000.0
      skip_pixel: 2
      p_hit: 0.65
      p_miss: 0.35
      p_min: 0.12
      p_max: 0.90
      p_occ: 0.80
      min_ray_length: 0.2
      max_ray_length: 6.0
      virtual_ceil_height: 1.6
      visualization_truncate_height: 1.5
      show_occ_time: false
      pose_type: 2            # odometry
      map_type: 1             # PLANNING: 2D grid from the segmented cloud
      frame_id: "map"

    manager:
      max_vel: 1.0
      max_acc: 1.5
      max_jerk: 3.0
      control_points_distance: 0.3
      feasibility_tolerance: 0.05
      planning_horizon: 9.0

    optimization:
      lambda_smooth: 1.0
      lambda_collision: 0.8
      lambda_feasibility: 0.1
      lambda_fitness: 1.0
      dist0: 1.0
      max_vel: 1.0
      max_acc: 1.5
      order: 3

    bspline:
      limit_vel: 1.0
      limit_acc: 1.5
      limit_ratio: 1.1

traj_server:
  ros__parameters:
    use_sim_time: true
    MPC:
      v_max: 1.2
      w_max: 1.5
      omega0: 1.0
      omega1: 0.5
    pose_topic: ""
