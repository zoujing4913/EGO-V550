# ego-planner parameters for the CMU indoor corridor scene
# (worlds/cmu_indoor.world: ~129 x 99 m of corridors, ~3.9 m high).
#
# The differences to config/ego_planner_sim.yaml (small arena) are the map size
# (the buffer is centred on the origin and has to cover the whole scene) and the
# larger local update range, so that a corridor is observed far enough ahead.
#
# Memory: 1400 x 1100 x 25 voxels at 0.1 m resolution = 38.5e6 voxels ~ 0.6 GB
# (occupancy buffer: 8 B + 1 B + 1 B + 2 B + 2 B + 1 B + 1 B per voxel).
# If that is too much, raise grid_map/resolution to 0.15 (~0.2 GB) or shrink
# map_size_z (the robot is only ~0.45 m tall).

ego_planner_node:
  ros__parameters:
    use_sim_time: true

    fsm:
      flight_type: 1          # goal from RViz / a PoseStamped topic
      thresh_replan: 1.0
      thresh_no_replan: 1.5
      planning_horizon: 10.0
      planning_horizen_time: 3.0
      emergency_time_: 1.0
      w_adjust_: 0.8
      waypoint_num: 0

    grid_map:
      resolution: 0.1
      map_size_x: 140.0
      map_size_y: 110.0
      map_size_z: 2.5
      local_update_range_x: 8.0
      local_update_range_y: 8.0
      local_update_range_z: 1.5
      # the corridors of this scene are ~2 m wide and the robot is 0.36 m across:
      # keep the inflated band small (0.22 m ≈ half the robot) so that the tracked
      # robot never ends up "inside" an obstacle, which would abort every replan
      obstacles_inflation: 0.22
      local_map_margin: 2
      ground_height: -0.05
      cx: 321.04638671875
      cy: 243.44969177246094
      fx: 387.229248046875
      fy: 387.229248046875
      use_depth_filter: true
      depth_filter_tolerance: 0.15
      depth_filter_maxdist: 5.0
      depth_filter_mindist: 0.2
      depth_filter_margin: 1
      k_depth_scaling_factor: 1000.0
      skip_pixel: 2
      p_hit: 0.65
      p_miss: 0.35
      p_min: 0.12
      p_max: 0.90
      p_occ: 0.80
      min_ray_length: 0.2
      max_ray_length: 8.0
      virtual_ceil_height: 2.0
      visualization_truncate_height: 2.0
      show_occ_time: false
      pose_type: 2            # odometry
      map_type: 1             # PLANNING: 2D grid from the segmented cloud
      frame_id: "map"

    manager:
      max_vel: 1.0
      max_acc: 1.5
      max_jerk: 3.0
      control_points_distance: 0.5
      feasibility_tolerance: 0.05
      planning_horizon: 10.0

    optimization:
      lambda_smooth: 1.0
      lambda_collision: 1.2
      lambda_feasibility: 0.1
      lambda_fitness: 1.0
      dist0: 1.0
      max_vel: 1.0
      max_acc: 1.5
      order: 3
      # narrow corridors: if the robot is closer to a wall than obstacles_inflation
      # (tracking error), keep planning out of it instead of aborting every plan
      relaxed_initial_collision: true

    bspline:
      limit_vel: 1.0
      limit_acc: 1.5
      limit_ratio: 1.1

traj_server:
  ros__parameters:
    use_sim_time: true
    MPC:
      v_max: 1.2
      w_max: 1.5
      omega0: 1.0
      omega1: 0.5
    pose_topic: ""
